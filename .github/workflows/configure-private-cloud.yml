name: Configure Provider Private Cloud
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply after plan (unchecked = plan-only dry run against real credentials)"
        type: boolean
        default: false
      state_rm:
        description: "Optional: space or comma separated terraform state addresses to `terraform state rm` before planning (e.g. state surgery for provider migrations)"
        type: string
        default: ""
      state_import:
        description: "Optional: space or comma separated addr=id pairs to `terraform import` after state_rm and before planning (e.g. re-importing an object that state surgery removed by mistake)"
        type: string
        default: ""
      oauth_app_imports:
        description: "Optional: JSON map of org key to full OAuth-app API path, passed through to TF_VAR_oauth_app_imports for the import-block recovery path (distinct from state_import: use this when a restapi_object.oauth_app entry is missing from state, since state_import's CLI import fails eval on that resource's cross-references)"
        type: string
        default: ""

jobs:
  # Runs on every push and PR (fork-gated). No secrets: fmt-check and a
  # backend-less validate only, so a PR branch can never read or exfiltrate
  # production credentials just by being opened. Credentialed planning is
  # confined to the `plan-and-apply` and `content` jobs below, neither of
  # which ever runs on pull_request events.
  #
  # `content/` is its own root module (own backend, own provider block), not
  # a child module of this root, so the platform-root fmt/init/validate
  # steps below never touch it on their own: `terraform fmt -check` without
  # `-recursive` only checks the current directory, and `terraform init` /
  # `terraform validate` only ever operate on the working directory they're
  # run from. Without the `-recursive` flag and the separate content/ init +
  # validate steps below, a malformed or provider-incompatible content/
  # config would pass this job and only be caught by the credentialed
  # `content` job, after `plan-and-apply` has already applied on a push to
  # main.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    runs-on: lab

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Init (content/, no backend)
        working-directory: content
        run: terraform init -backend=false -input=false

      - name: Terraform Validate (content/)
        working-directory: content
        run: terraform validate

  # Runs on push to main (always applies) and on workflow_dispatch (plan-only
  # by default, applies only if the `apply` input is explicitly set true).
  # This is the sole job that ever sees production secrets (AWS for the S3
  # backend, VCFA API token, Ops API vIDB user token). A saved terraform
  # plan for this repo is credential-bearing (OIDC client secrets appear in a
  # plan that touches an existing org's federation), so it is neither
  # uploaded as an artifact nor left on disk: plan and apply happen back-to-
  # back in the same step, and cleanup runs unconditionally afterward
  # regardless of outcome.
  #
  # workflow_dispatch plan-only exists because push-to-main applies with
  # -auto-approve and there was previously no way to see a real, credentialed
  # plan before that first live apply -- see README's "Dry-run before merge"
  # section for why that mattered here specifically (unverified vcenter_name
  # placeholder, and the external CIDR's surviving supervisor-side block).
  plan-and-apply:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: lab
    timeout-minutes: 30

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # vcfa provider api_token auth (VCF Admin service account, provider portal).
      TF_VAR_vcfa_api_token: ${{ secrets.VCF_LAB_PROVIDER_REFRESH_KEY }}

      # VCF Operations IAM API (OIDC client minting/rotation, see orgs.tf).
      # ops_api_base_url is a known lab hostname, not a credential, so it's a
      # plain value here rather than a repo secret (see variables.tf's doc
      # comment for ops_api_base_url). ops_api_token is NOT a stored secret
      # either: it's a short-lived bearer token acquired at runtime by the
      # vIDB token exchange step below and exported via GITHUB_ENV.
      TF_VAR_ops_api_base_url: "https://vcf-lab-operations.int.sentania.net"

      # vIDB token exchange host, same lab tenant as oidc_wellknown_endpoint
      # in envs/lab.tfvars (that value is a Terraform var set via -var-file,
      # not a shell-accessible env var in this workflow, so it's repeated
      # here as a plain literal rather than plumbed through). Known lab
      # hostname, not a credential.
      VCF_LAB_VIDB_TOKEN_URL: "https://vcf-lab-idb.int.sentania.net/acs/t/CUSTOMER/token"

      # Single shared password (Scott: one password for both orgs' break-glass
      # admins for now) exposed only as an env var, never interpolated
      # straight into a shell command: the "Build local admin passwords"
      # step below turns it into the map(string) JSON TF_VAR wants via
      # `jq -n --arg`, which keeps the raw value out of any logged command
      # line the same way the Ops token acquire step below avoids it.
      VCFA_FIRST_USER_DEFAULT_PASSWORD: ${{ secrets.VCFA_FIRST_USER_DEFAULT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # The restapi provider can't do a login round-trip itself, and Ops
      # tokens are short-lived and acquired, not stored. The stored secret is
      # a durable vIDB user API token (VCF_LAB_API_TOKEN), exchanged here for
      # a short-lived Bearer token via the documented vIDB token-exchange
      # flow, before any terraform step runs. See README's "Ops API auth"
      # section. suite-api's own token/acquire endpoint cannot be used here:
      # the CI account (vcf@int.sentania.net) is SSO-backed and that endpoint
      # rejects SSO accounts (confirmed live with 401s).
      - name: Exchange vIDB API token for Ops API bearer token
        run: |
          set -euo pipefail

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT

          status=$(curl -s -o "$body_file" -w '%{http_code}' -X POST \
            "$VCF_LAB_VIDB_TOKEN_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:custom:vcf:params:oauth:grant-type:api-token" \
            --data-urlencode "api_token=${{ secrets.VCF_LAB_API_TOKEN }}") || status="000"

          if [ "${status:0:1}" != "2" ]; then
            echo "vIDB token exchange failed with HTTP status: $status" >&2
            case "$status" in
              401)
                echo "Token rejected: VCF_LAB_API_TOKEN is invalid, expired, or revoked" >&2
                ;;
              400)
                echo "Request rejected: check the grant_type / request shape" >&2
                ;;
              *)
                echo "Unexpected status: check endpoint reachability / connectivity" >&2
                ;;
            esac
            exit 1
          fi

          token=$(jq -r '.access_token' "$body_file")

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to exchange vIDB API token for a bearer token (check VCF_LAB_API_TOKEN or endpoint reachability)" >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "TF_VAR_ops_api_token=$token" >> "$GITHUB_ENV"

      # Builds the map(string) JSON that TF_VAR_local_admin_passwords needs,
      # keyed by both org keys in var.orgs (all_apps, vm_apps), from the
      # single shared VCFA_FIRST_USER_DEFAULT_PASSWORD secret above.
      # `jq -n --arg` reads the value from the env var rather than
      # interpolating it into the command string, so it never appears in
      # the runner's command log even before GitHub's own masking applies.
      - name: Build local admin passwords
        run: |
          passwords=$(jq -nc --arg pw "$VCFA_FIRST_USER_DEFAULT_PASSWORD" \
            '{all_apps: $pw, vm_apps: $pw}')
          echo "TF_VAR_local_admin_passwords=$passwords" >> "$GITHUB_ENV"

      # Plain init, not -migrate-state: that flag is for migrating between
      # backend configurations (e.g. changing backend.tf's bucket/key), and
      # this repo's remote state doesn't exist yet for its first-ever apply.
      # A plain init still creates the state object on first run.
      - name: Terraform Init
        run: terraform init -input=false

      # Optional manual escape hatch: CI-native state surgery (no SSH, no
      # local state file edits) for cases like a provider migration leaving
      # behind state entries the new provider version can't safely refresh.
      # Only ever fires on an explicit workflow_dispatch run: push events
      # never populate `inputs.*`, so the gating lives inside the step body
      # (checking the input value itself) rather than only in the step-level
      # `if`, matching this workflow's existing apply-toggle gating style.
      - name: Terraform state rm (manual escape hatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          STATE_RM_INPUT: ${{ inputs.state_rm }}
        run: |
          set -euo pipefail

          if [ -z "$STATE_RM_INPUT" ]; then
            echo "No state_rm input provided, skipping state surgery."
            exit 0
          fi

          # Split on commas first, then on whitespace within each piece, so
          # both "a, b" and "a b" work. Addresses like
          # restapi_object.oauth_app["all_apps"] contain brackets and quotes
          # but never spaces, so word-splitting on whitespace only is safe
          # here. Each address is passed to `terraform state rm` as its own
          # argument (quoted), never string-interpolated together.
          echo "$STATE_RM_INPUT" | tr ',' '\n' | while IFS= read -r line; do
            for addr in $line; do
              [ -z "$addr" ] && continue
              echo "Removing from state: $addr"
              terraform state rm -- "$addr"
            done
          done

      # Optional manual escape hatch, symmetric to state_rm above and run
      # strictly after it: CI-native re-import (no SSH, no local state file
      # edits) for cases like state_rm's own failure mode, where a stale
      # second run executed a by-then-outdated state_rm against a resource
      # that a first run had already created live. The right fix there is
      # not "recreate it" (a new create call against an object that already
      # exists live, and is already referenced elsewhere, fails or diverges
      # identity), it's putting the existing live object back into state.
      # Same workflow_dispatch-only gating as state_rm.
      - name: Terraform state import (manual escape hatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          STATE_IMPORT_INPUT: ${{ inputs.state_import }}
        run: |
          set -euo pipefail

          if [ -z "$STATE_IMPORT_INPUT" ]; then
            echo "No state_import input provided, skipping state import."
            exit 0
          fi

          # Same split strategy as state_rm: commas first, then whitespace
          # within each piece. Each pair is "<address>=<id>"; addresses like
          # restapi_object.oauth_app["all_apps"] contain brackets and quotes
          # but never spaces or '=', and provider import ids here are full
          # API paths (slashes/dashes, no spaces or '='), so splitting the
          # pair on the first '=' is unambiguous.
          echo "$STATE_IMPORT_INPUT" | tr ',' '\n' | while IFS= read -r line; do
            for pair in $line; do
              [ -z "$pair" ] && continue

              if [[ "$pair" != *"="* ]]; then
                echo "Malformed state_import pair (expected addr=id, got '$pair')" >&2
                exit 1
              fi

              addr="${pair%%=*}"
              id="${pair#*=}"

              if [ -z "$addr" ] || [ -z "$id" ]; then
                echo "Malformed state_import pair (empty address or id in '$pair')" >&2
                exit 1
              fi

              echo "Importing into state: $addr <- $id"
              terraform import -var-file="envs/lab.tfvars" -- "$addr" "$id"
            done
          done

      # Optional manual escape hatch, distinct from state_import above: an
      # import-block based recovery path for restapi_object.oauth_app
      # specifically. See orgs.tf's `import` block and README's escape-hatch
      # section for why this resource needs a different recovery mechanism
      # than the CLI state_import step (a missing oauth_app instance makes
      # this file's own cross-references to it fail at eval time before a
      # CLI import ever commits; an import block is evaluated as part of the
      # plan graph and doesn't hit that problem). The input is already JSON
      # shaped for var.oauth_app_imports (map(string)), so it's passed
      # through verbatim, no reshaping. Same workflow_dispatch-only gating
      # as state_rm/state_import.
      - name: Set oauth_app_imports (import-block recovery, manual escape hatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          OAUTH_APP_IMPORTS_INPUT: ${{ inputs.oauth_app_imports }}
        run: |
          set -euo pipefail

          if [ -z "$OAUTH_APP_IMPORTS_INPUT" ]; then
            echo "No oauth_app_imports input provided, skipping import-block recovery."
            exit 0
          fi

          echo "TF_VAR_oauth_app_imports=$OAUTH_APP_IMPORTS_INPUT" >> "$GITHUB_ENV"

      - name: Terraform Plan
        run: |
              terraform plan -input=false -no-color \
              -var-file="envs/lab.tfvars" \
              -out=tfplan

      # Only applies on push to main, or on workflow_dispatch with apply=true.
      # A workflow_dispatch run with the toggle left at its false default
      # stops here: plan output is already in the step above's log, tfplan
      # is never applied, and the cleanup step below still removes it.
      - name: Terraform Apply
        if: github.event_name == 'push' || inputs.apply == true
        run: terraform apply -input=false -auto-approve tfplan

      # Unconditional: the local plan file (tfplan) carries the same
      # sensitive root-variable values as the apply above, regardless of
      # whether plan/apply succeeded, failed, or was skipped as plan-only.
      #
      # The `lab` pool runs one ephemeral pod per job and destroys it
      # afterwards, so this step cleans something that is about to cease to
      # exist. Kept anyway, deliberately: it costs a second, it is correct
      # on any runner, and it does not depend on the pool's disposal
      # behaviour staying true. What is NOT true any more is the reason
      # originally written here, that the runner is persistent.
      - name: Clean workspace
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

  # Provider content library, its own apply stage (content/), gated to run
  # only after the platform stage (plan-and-apply) succeeds: content is not
  # platform, and must not gate identity/networking. See README's "Content
  # is its own stage" section. Same trigger gating as plan-and-apply, same
  # apply-toggle semantics, same unconditional cleanup. Only the vcfa
  # provider's own credentials plus the AWS backend creds are needed here:
  # no Ops API token, no local admin passwords, those are platform-only
  # concerns this stage never touches.
  content:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: plan-and-apply
    runs-on: lab
    timeout-minutes: 30

    defaults:
      run:
        working-directory: content

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # vcfa provider api_token auth (VCF Admin service account, provider
      # portal). Same secret the platform stage uses: content library
      # operations are org System, PROVIDER-scoped, same auth as the
      # platform root.
      TF_VAR_vcfa_api_token: ${{ secrets.VCF_LAB_PROVIDER_REFRESH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Answers var.adopt_content_library per run: nobody hand-flips this
      # in committed config (see content/variables.tf). Queries VCFA for a
      # content library named "vcf-lab-content-library" under org System
      # using the same TF_VAR_vcfa_api_token the job already holds (job env
      # block above), and writes the result to TF_VAR_adopt_content_library
      # via GITHUB_ENV, same pattern as "Acquire Ops API token" in the
      # platform job.
      #
      # Endpoint and Accept-header version confirmed against the vcfa
      # provider's own SDK (github.com/vmware/go-vcloud-director,
      # govcd/tm_content_library.go GetContentLibraryByName, which issues
      # GET {vcf/contentLibraries/} with filter=name==<name>;
      # govcd/openapi_endpoints.go maps that endpoint to minimum API version
      # 40.0; govcd/openapi.go builds the Accept header as
      # "application/json;version=<apiVersion>"). The api_token var is a
      # refresh token, not a bearer token: govcd/api_token.go exchanges it
      # via POST {rootHref}/oauth/provider/token (org System) with
      # grant_type=refresh_token before it can be used as a Bearer token,
      # mirrored below.
      #
      # A curl failure (auth error, non-2xx, network error) fails this step,
      # rather than silently defaulting either way: "API call failed" must
      # abort the job, not be treated as "library doesn't exist". Only a
      # clean 200 with an empty/non-matching result set is treated as a
      # legitimate "does not exist yet". Status is captured explicitly
      # (rather than relying on `curl -f`) so a transport-level failure
      # (status "000": TLS, DNS, connectivity, curl never got an HTTP
      # response) can be told apart from a real non-2xx HTTP status from the
      # API, same pattern as the "Exchange vIDB API token" step above.
      - name: Probe for existing content library
        run: |
          set -euo pipefail

          vcfa_url=$(grep '^vcfa_url' envs/lab.tfvars | cut -d '"' -f2)

          # TLS is verified normally here. These two calls carried -k from
          # 189760e, added because the OLD self-hosted runner did not trust
          # the lab CA and the probe failed with curl exit 60. The `lab`
          # image ships the lab root CA in its system trust store, so the
          # cause is gone and the workaround goes with it.
          #
          # Verified rather than assumed: vcf-lab-automation.int.sentania.net
          # presents a cert issued by "sentania Lab Issuing 2", and curl
          # against it from a host carrying that CA returns
          # ssl_verify_result=0 with no -k.
          #
          # This does NOT follow the vcfa provider's allow_unverified_ssl:
          # that is a separate, already-accepted decision for the provider,
          # and there is no reason to copy it here now that these calls can
          # verify properly. If this step ever fails with curl exit 60
          # again, the CA is missing from the image: fix it there rather
          # than restoring -k here.
          token_body_file=$(mktemp)
          trap 'rm -f "$token_body_file"' EXIT

          token_status=$(curl -s -o "$token_body_file" -w '%{http_code}' -X POST "$vcfa_url/oauth/provider/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$TF_VAR_vcfa_api_token") || token_status="000"

          if [ "${token_status:0:1}" != "2" ]; then
            if [ "$token_status" = "000" ]; then
              echo "VCFA token request failed: transport-level failure (connectivity/TLS/DNS), no HTTP response" >&2
            else
              echo "VCFA token request failed with HTTP status: $token_status" >&2
            fi
            exit 1
          fi

          access_token=$(jq -r '.access_token' "$token_body_file")
          echo "::add-mask::$access_token"

          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Failed to acquire a VCFA bearer token for the content library probe" >&2
            exit 1
          fi

          response_body_file=$(mktemp)
          trap 'rm -f "$token_body_file" "$response_body_file"' EXIT

          response_status=$(curl -s -o "$response_body_file" -w '%{http_code}' -G "$vcfa_url/cloudapi/vcf/contentLibraries/" \
            -H "Authorization: Bearer $access_token" \
            -H "Accept: application/json;version=40.0" \
            --data-urlencode "filter=name==vcf-lab-content-library") || response_status="000"

          if [ "${response_status:0:1}" != "2" ]; then
            if [ "$response_status" = "000" ]; then
              echo "Content library list request failed: transport-level failure (connectivity/TLS/DNS), no HTTP response" >&2
            else
              echo "Content library list request failed with HTTP status: $response_status" >&2
            fi
            exit 1
          fi

          response=$(cat "$response_body_file")

          if ! echo "$response" | jq -e 'has("values")' >/dev/null; then
            echo "Unexpected response from the content library list endpoint (no 'values' field)" >&2
            exit 1
          fi

          match_count=$(echo "$response" | jq '[.values[] | select(.name == "vcf-lab-content-library")] | length')

          if [ "$match_count" -gt 0 ]; then
            echo "TF_VAR_adopt_content_library=true" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_adopt_content_library=false" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: |
              terraform plan -input=false -no-color \
              -var-file="envs/lab.tfvars" \
              -out=tfplan

      # Only applies on push to main, or on workflow_dispatch with apply=true.
      # Same semantics as the platform stage's apply step.
      - name: Terraform Apply
        if: github.event_name == 'push' || inputs.apply == true
        run: terraform apply -input=false -auto-approve tfplan

      # Unconditional, same rationale as the platform stage's cleanup step:
      # tfplan is credential-adjacent (it references live storage class and
      # org ids). See that step for why this is kept even though `lab` pods
      # are ephemeral.
      - name: Clean workspace
        if: always()
        working-directory: .
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
