name: Configure Provider Private Cloud
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Runs on every push and PR (fork-gated). No secrets: fmt-check and a
  # backend-less validate only, so a PR branch can never read or exfiltrate
  # production credentials just by being opened. Credentialed planning is
  # confined to the `plan-and-apply` job below, which never runs on
  # pull_request events.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    runs-on: [self-hosted, terraform]

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  # Push-to-main only: this is the sole job that ever sees production
  # secrets (AWS for the S3 backend, VCFA admin credentials, Ops API
  # credentials). A saved terraform plan for this repo is credential-bearing
  # (VCFA admin password, Ops API token in root variables; OIDC client
  # secrets in refreshed state), so it is neither uploaded as an artifact
  # nor left on disk: plan and apply happen back-to-back in the same step,
  # and cleanup runs unconditionally afterward regardless of outcome.
  plan-and-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: [self-hosted, terraform]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # VCFA System-org admin auth (username/password, not api_token: see
      # README's "why username/password" note).
      TF_VAR_vcfa_admin_username: ${{ secrets.VCF_LAB_SYSTEM_ADMIN_USERNAME }}
      TF_VAR_vcfa_admin_password: ${{ secrets.VCF_LAB_SYSTEM_ADMIN_PASSWORD }}

      # VCF Operations IAM API (OIDC client minting/rotation, see orgs.tf).
      TF_VAR_ops_api_base_url: ${{ secrets.VCF_OPS_API_BASE_URL }}
      TF_VAR_ops_api_token: ${{ secrets.VCF_OPS_API_TOKEN }}
      TF_VAR_sso_realm_id: ${{ secrets.VCF_OPS_SSO_REALM_ID }}

      # local_admin_passwords is a map(string): an unset secret resolves to
      # an empty string, which is not valid HCL/JSON for a complex-typed
      # TF_VAR and breaks `terraform plan` with a parse error rather than
      # falling back to the variable's own default. Fall back to '{}' here
      # instead.
      TF_VAR_local_admin_passwords: ${{ secrets.VCF_LAB_ORG_LOCAL_ADMIN_PASSWORDS || '{}' }}
      TF_VAR_external_cidr: ${{ secrets.VCF_LAB_EXTERNAL_CIDR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Terraform Init
        run: terraform init -migrate-state -input=false

      - name: Terraform Plan and Apply
        run: |
              terraform plan -input=false -no-color \
              -var-file="envs/lab.tfvars" \
              -out=tfplan
              terraform apply -input=false -auto-approve tfplan

      # Unconditional: the local plan file (tfplan) carries the same
      # sensitive root-variable values as the apply above and must not
      # survive on this persistent self-hosted runner regardless of whether
      # plan/apply succeeded or failed.
      - name: Clean workspace
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
