name: Configure Provider Private Cloud
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply after plan (unchecked = plan-only dry run against real credentials)"
        type: boolean
        default: false

jobs:
  # Runs on every push and PR (fork-gated). No secrets: fmt-check and a
  # backend-less validate only, so a PR branch can never read or exfiltrate
  # production credentials just by being opened. Credentialed planning is
  # confined to the `plan-and-apply` job below, which never runs on
  # pull_request events.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    runs-on: [self-hosted, terraform]

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  # Runs on push to main (always applies) and on workflow_dispatch (plan-only
  # by default, applies only if the `apply` input is explicitly set true).
  # This is the sole job that ever sees production secrets (AWS for the S3
  # backend, VCFA API token, Ops API username/password). A saved terraform
  # plan for this repo is credential-bearing (OIDC client secrets appear in a
  # plan that touches an existing org's federation), so it is neither
  # uploaded as an artifact nor left on disk: plan and apply happen back-to-
  # back in the same step, and cleanup runs unconditionally afterward
  # regardless of outcome.
  #
  # workflow_dispatch plan-only exists because push-to-main applies with
  # -auto-approve and there was previously no way to see a real, credentialed
  # plan before that first live apply -- see README's "Dry-run before merge"
  # section for why that mattered here specifically (unverified vcenter_name
  # placeholder, and the external CIDR's surviving supervisor-side block).
  plan-and-apply:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: [self-hosted, terraform]

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # vcfa provider api_token auth (VCF Admin service account, provider portal).
      TF_VAR_vcfa_api_token: ${{ secrets.VCF_LAB_PROVIDER_REFRESH_KEY }}

      # VCF Operations IAM API (OIDC client minting/rotation, see orgs.tf).
      # ops_api_token is NOT a stored secret: it's a short-lived token acquired
      # at runtime by the step below and exported via GITHUB_ENV.
      TF_VAR_ops_api_base_url: ${{ secrets.VCF_OPS_API_BASE_URL }}

      # local_admin_passwords is a map(string): an unset secret resolves to
      # an empty string, which is not valid HCL/JSON for a complex-typed
      # TF_VAR and breaks `terraform plan` with a parse error rather than
      # falling back to the variable's own default. Fall back to '{}' here
      # instead.
      TF_VAR_local_admin_passwords: ${{ secrets.VCF_LAB_ORG_LOCAL_ADMIN_PASSWORDS || '{}' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # The restapi provider can't do a login round-trip itself, and Ops
      # tokens are short-lived and acquired, not stored: VCF_LAB_OPS_USER /
      # VCF_LAB_OPS_PASSWORD are the stored secrets, this step exchanges them
      # for a token before any terraform step runs. See README's "Ops API
      # auth" section.
      - name: Acquire Ops API token
        run: |
          token=$(curl -sf -X POST "${{ secrets.VCF_OPS_API_BASE_URL }}/suite-api/api/auth/token/acquire" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.VCF_LAB_OPS_USER }}\",\"password\":\"${{ secrets.VCF_LAB_OPS_PASSWORD }}\"}" \
            | jq -r '.token')
          echo "::add-mask::$token"
          echo "TF_VAR_ops_api_token=$token" >> "$GITHUB_ENV"

      # Plain init, not -migrate-state: that flag is for migrating between
      # backend configurations (e.g. changing backend.tf's bucket/key), and
      # this repo's remote state doesn't exist yet for its first-ever apply.
      # A plain init still creates the state object on first run.
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: |
              terraform plan -input=false -no-color \
              -var-file="envs/lab.tfvars" \
              -out=tfplan

      # Only applies on push to main, or on workflow_dispatch with apply=true.
      # A workflow_dispatch run with the toggle left at its false default
      # stops here: plan output is already in the step above's log, tfplan
      # is never applied, and the cleanup step below still removes it.
      - name: Terraform Apply
        if: github.event_name == 'push' || inputs.apply == true
        run: terraform apply -input=false -auto-approve tfplan

      # Unconditional: the local plan file (tfplan) carries the same
      # sensitive root-variable values as the apply above and must not
      # survive on this persistent self-hosted runner regardless of whether
      # plan/apply succeeded, failed, or was skipped as plan-only.
      - name: Clean workspace
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
